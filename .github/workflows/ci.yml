name: CI
on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Java 17 is the baseline (build.sbt compiles with -release:17);
        # 21 checks the next LTS.
        java: [17, 21]
    name: test (JDK ${{ matrix.java }})
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Build and Test
        run: sbt -v +test
