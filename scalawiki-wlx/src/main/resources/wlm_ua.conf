    # Вікі любить пам'ятки 2026, Регламент п. 7.3-7.4, 9.4: https://w.wiki/U8NP
    "2026": {
      # п. 7.3.1 базовий бал за кожну пам'ятку
      "base-rate": 1,
      # п. 9.4 базовий бал 10 для АР Крим і Севастополя (01, 85), Донецької (14),
      # Запорізької (23), Луганської (44) та Херсонської (65) областей
      "war-region-base-rate": {
        rate: 10,
        regions: ["01", "14", "23", "44", "65", "85"]
      },
      # п. 7.3.2 бонус за кількість авторів наявних фотографій пам'ятки
      # (10 і більше авторів — 0 балів, тобто діапазон за замовчуванням)
      "number-of-authors-bonus": {
        same-author-zero-bonus: false,
        "0-0": 12,
        "1-3": 6,
        "4-6": 3,
        "7-9": 1
      },
      # п. 7.3.3 бонус за кількість наявних фотографій пам'яток з населеного пункту
      # (50 і більше фотографій — 0 балів, тобто діапазон за замовчуванням)
      "number-of-images-bonus": {
        same-author-zero-bonus: false,
        "0-0": 10,
        "1-3": 6,
        "4-9": 3,
        "10-49": 1
      },
      # п. 7.3.5 бонус за наявні фотографії інтер'єрів пам'ятки
      # (6 і більше — 0 балів, тобто діапазон за замовчуванням)
      "number-of-interior-images-bonus": {
        "0-0": 5,
        "1-5": 3
      },
      # п. 7.3.4 додаткові 5 балів, якщо всі наявні фотографії пам'ятки
      # датовані періодом до 01.01.2020
      "old-photos-bonus": {
        bonus: 5,
        before-date: "2020-01-01"
      }
    }
   }

  # Key contest dates per year. Transcribed from the official rules
  # (Регламент, https://ua.wikimedia.org/wiki/Вікі_любить_пам%27ятки_<year>/Регламент,
  # clause 5.2 for the upload window, 9.1 for the pictured-date limit); years with
  # no rules page fall back to the WLM-international standard (a one-month slot in
  # Sept-Oct — Ukraine used September through 2021, October from 2022 on).
  # Dates are ISO yyyy-MM-dd, interpreted as end-of-day in `timezone`. Consumed
  # by ContestDates via Contest.dates(year):
  #   upload-start / upload-end      -- on-wiki submission window; upload-end is
  #                                    the "accurate until" cut-off for
  #                                    --csv-cache-resync of a frozen past year.
  #   latest-allowed-pictured-date   -- photos for the main nominations must be
  #                                    created on/before this date (wartime rule);
  #                                    replaces the old hard-coded 30 June.
  dates {
    timezone = "Europe/Kyiv"

    "2012" { upload-start = "2012-09-01", upload-end = "2012-09-30" }  # no rules page; WLM-international September
    "2013" { upload-start = "2013-09-01", upload-end = "2013-09-30" }  # no rules page; WLM-international September
    "2014" { upload-start = "2014-09-01", upload-end = "2014-09-30" }  # no rules page; WLM-international September
    "2015" { upload-start = "2015-09-01", upload-end = "2015-09-30" }  # Регламент 2015 п. 5.2
    "2016" { upload-start = "2016-09-01", upload-end = "2016-09-30" }  # Регламент 2016 п. 5.2
    "2017" { upload-start = "2017-09-01", upload-end = "2017-09-30" }  # Регламент 2017 п. 5.2
    "2018" { upload-start = "2018-09-01", upload-end = "2018-09-30" }  # Регламент 2018 п. 5.2
    "2019" { upload-start = "2019-09-01", upload-end = "2019-09-30" }  # Регламент 2019 п. 5.2
    "2020" { upload-start = "2020-09-01", upload-end = "2020-09-30" }  # Регламент 2020 п. 5.2
    "2021" { upload-start = "2021-09-01", upload-end = "2021-09-30" }  # Регламент 2021 п. 5.2
    # from 2022 the Ukrainian contest runs in October and photos must predate a security cut-off
    "2022" { upload-start = "2022-10-01", upload-end = "2022-10-31", latest-allowed-pictured-date = "2022-02-23" }  # Регламент 2022 пп. 5.2, 9.1
    "2023" { upload-start = "2023-10-01", upload-end = "2023-10-31", latest-allowed-pictured-date = "2023-06-30" }  # Регламент 2023 пп. 5.2, 9.1
    "2024" { upload-start = "2024-10-01", upload-end = "2024-10-31", latest-allowed-pictured-date = "2024-06-30" }  # Регламент 2024 пп. 5.2, 9.1
    "2025" { upload-start = "2025-10-01", upload-end = "2025-10-31", latest-allowed-pictured-date = "2025-08-31" }  # Регламент 2025 пп. 5.2, 9.1
    "2026" { upload-start = "2026-10-01", upload-end = "2026-10-31", latest-allowed-pictured-date = "2026-08-31" }  # Регламент 2026 пп. 5.2, 9.1
  }

